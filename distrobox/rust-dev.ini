# rust-dev - reusable Rust / cargo development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/rust-dev.ini
#
# Do NOT add --replace: that can remove the isolated HOME. Recreate the
# container only deliberately.

[rust-dev]
image=registry.fedoraproject.org/fedora:44

# Isolated HOME. Rust toolchains, the cargo registry cache, agent
# authentication, and dotfiles stay out of the host HOME and out of other
# development environments.
home=$HOME/.local/share/distrobox-homes/rust-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/rust-dev-packages.txt is the source of truth. This literal list is
# repeated because the Distrobox INI format cannot read the manifest directly.
additional_packages="git jq gh curl gcc gcc-c++ make pkgconf-pkg-config"

init=false
nvidia=false
pull=true
start_now=false
