# python-dev - reusable Python / uv development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/python-dev.ini
#
# Do NOT add --replace: that can remove the isolated HOME. Recreate the
# container only deliberately.

[python-dev]
image=registry.fedoraproject.org/fedora:44

# Isolated HOME. Python runtimes, uv state, agent authentication, and dotfiles
# stay out of the host HOME and out of other development environments.
home=$HOME/.local/share/distrobox-homes/python-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/python-dev-packages.txt is the source of truth. This literal list is
# repeated because the Distrobox INI format cannot read the manifest directly.
additional_packages="git jq gh curl sqlite gcc gcc-c++ make pkgconf-pkg-config"

init=false
nvidia=false
pull=true
start_now=false
