# android-dev - Android/Kotlin development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/android-dev.ini
#
# Do not add --replace. It can remove the isolated HOME.

[android-dev]
image=registry.fedoraproject.org/fedora:44

# Keep Android SDK state, Gradle caches, agent authentication, and dotfiles
# outside the host HOME and other development environments.
home=$HOME/.local/share/distrobox-homes/android-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/android-dev-packages.txt is the source of truth. This list is
# repeated because the Distrobox INI format cannot read the manifest directly.
additional_packages="git jq gh curl unzip java-25-openjdk-devel gcc gcc-c++ make pkgconf-pkg-config"

init=false
nvidia=false
pull=true
start_now=false
