# dotnet-dev - reusable .NET / C# development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/dotnet-dev.ini
#
# Do not add --replace. It can remove the isolated HOME.

[dotnet-dev]
image=registry.fedoraproject.org/fedora:44

# Keep the .NET CLI state, agent authentication, and dotfiles outside the host HOME.
home=$HOME/.local/share/distrobox-homes/dotnet-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/dotnet-dev-packages.txt is the source of truth. This literal list is
# repeated because the Distrobox INI format cannot read the manifest.
additional_packages="git jq gh curl dotnet-sdk-10.0 gcc gcc-c++ make pkgconf-pkg-config"

init=false
nvidia=false
pull=true
start_now=false
