# web-dev - Node/pnpm web development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/web-dev.ini
#
# distrobox-assemble sources the parsed values, so $HOME expands correctly.
# Do NOT add --replace: that destroys the existing container and its
# isolated HOME. See docs/recovery.md.
#
# The generated podman command was verified against the running container with
#     distrobox assemble create --dry-run --file distrobox/web-dev.ini
# on distrobox 1.8.2.5.

[web-dev]
image=registry.fedoraproject.org/fedora:44

# Isolated HOME. Keeps the box's dotfiles out of the host home.
home=$HOME/.local/share/distrobox-homes/web-dev

# The canonical source checkout root of the host, mounted at a stable path.
volume=$HOME/projects:/workspace:rw

# Base packages. The language toolchain is NOT installed here; bootstrap/web-dev.sh
# installs Node through nvm inside the isolated HOME.
additional_packages="git jq gh"

init=false
nvidia=false
pull=true
start_now=false
