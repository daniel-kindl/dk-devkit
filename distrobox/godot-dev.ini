# godot-dev - reusable Godot and C# game development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/godot-dev.ini
#
# Do not add --replace. It can remove the isolated HOME.

[godot-dev]
image=registry.fedoraproject.org/fedora:44

# Keep the engine, the .NET CLI state, agent authentication, and dotfiles
# outside the host HOME.
home=$HOME/.local/share/distrobox-homes/godot-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/godot-dev-packages.txt is the source of truth. This literal list is
# repeated because the Distrobox INI format cannot read the manifest.
additional_packages="git bubblewrap jq gh curl unzip gcc gcc-c++ make pkgconf-pkg-config dotnet-sdk-10.0 dotnet-targeting-pack-8.0 mesa-dri-drivers mesa-vulkan-drivers mesa-libGL mesa-libEGL vulkan-loader libX11 libXcursor libXinerama libXrandr libXi libXext libxkbcommon libxkbcommon-x11 libwayland-client libwayland-cursor libwayland-egl libdecor alsa-lib pulseaudio-libs fontconfig freetype desktop-file-utils"

init=false
# The editor draws through the host GPU. Distrobox passes the graphics devices
# through on its own; this flag is only for the proprietary NVIDIA driver.
nvidia=false
pull=true
start_now=false
