# golang-dev - reusable Go development environment.
#
# Apply with:
#     distrobox assemble create --file distrobox/golang-dev.ini
#
# Do not add --replace. It can remove the isolated HOME.

[golang-dev]
image=registry.fedoraproject.org/fedora:44

# Keep Go caches, agent authentication, and dotfiles outside the host HOME.
home=$HOME/.local/share/distrobox-homes/golang-dev

# Shared source checkout root.
volume=$HOME/projects:/workspace:rw

# manifests/golang-dev-packages.txt is the source of truth. This list is
# repeated because the Distrobox INI format cannot read the manifest.
additional_packages="git jq gh curl golang gcc gcc-c++ make pkgconf-pkg-config"

init=false
nvidia=false
pull=true
start_now=false
