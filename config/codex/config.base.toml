# Non-secret Codex defaults. bootstrap/configure-codex.py applies these to
# $CODEX_HOME/config.toml and migrates the previous toolkit policy. Authentication
# (auth.json) and per-project trust levels are runtime state and stay local.
model = "gpt-5.6-luna"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
